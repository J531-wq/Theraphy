<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found — MyTherapyDoctor</title>
  {% load static %}
  <link rel="icon" type="image/png" href="{% static 'core/logo.png' %}">
  <meta name="description" content="MyTherapyDoctor — AI-powered online therapy and mental wellness support. The page you're looking for doesn't exist.">
  <meta property="og:image" content="https://mytherapydoctor.com{% static 'core/Social.jpg' %}">
  <meta name="twitter:image" content="https://mytherapydoctor.com{% static 'core/Social.jpg' %}">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    @font-face {
      font-family: 'Playfair Display';
      src: url("{% static 'PlayfairDisplay-SemiBoldItalic.ttf' %}") format('truetype');
      font-weight: 600; font-style: italic; font-display: swap;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --teal:        #2e7d6e;
      --teal-light:  #3d9e8c;
      --teal-glow:   rgba(46,125,110,0.4);
      --glass-bg:    rgba(6,14,12,0.62);
      --glass-border:rgba(255,255,255,0.09);
      --text:        #f0f4f3;
      --muted:       rgba(240,244,243,0.55);
    }
    html, body { width: 100%; height: 100%; font-family: 'Inter', sans-serif; }
    body {
      min-height: 100vh;
      display: flex; flex-direction: column;
      background:
        linear-gradient(160deg, rgba(0,0,0,0.72) 0%, rgba(0,18,14,0.52) 100%),
        url("{% static 'core/section.jpg.jpeg' %}") no-repeat center center / cover fixed;
      color: var(--text);
      opacity: 0;
      transition: opacity 0.5s ease;
      overflow-x: hidden;
    }
    body.page-loaded { opacity: 1; }
    body.page-exit   { opacity: 0; }
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 48px;
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--glass-border);
    }
    .brand-label {
      font-size: 11px; font-weight: 600; letter-spacing: 2.5px;
      text-transform: uppercase; color: var(--teal-light);
      display: flex; align-items: center; gap: 8px;
    }
    .brand-label img { width: 22px; height: 22px; }
    .brand-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--teal-light);
      box-shadow: 0 0 10px var(--teal-glow);
    }
    .error-section {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 120px 24px 80px;
    }
    .error-code {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(72px, 12vw, 120px);
      font-weight: 600; font-style: italic;
      color: var(--teal-light);
      text-shadow: 0 4px 40px rgba(46,125,110,0.3);
      line-height: 1;
      margin-bottom: 20px;
    }
    .error-section h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 600; font-style: italic;
      color: var(--text);
      text-shadow: 0 2px 20px rgba(0,0,0,0.6);
      margin-bottom: 16px;
    }
    .error-section p {
      font-size: 15px; line-height: 1.7;
      color: var(--muted);
      max-width: 480px;
      margin-bottom: 36px;
    }
    .btn-primary {
      padding: 13px 32px;
      background: linear-gradient(135deg, var(--teal), var(--teal-light));
      border: none; border-radius: 8px;
      color: #fff; font-size: 14px; font-weight: 600; font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 16px var(--teal-glow);
      transition: opacity 0.2s, transform 0.15s;
    }
    .btn-primary:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-ghost {
      padding: 13px 28px;
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: var(--text); font-size: 14px; font-weight: 500; font-family: inherit;
      cursor: pointer; transition: background 0.2s;
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.14); }
    footer {
      text-align: center; padding: 20px 24px;
      font-size: 12px; color: var(--muted);
    }
    @media (max-width: 600px) {
      nav { padding: 14px 20px; }
      .error-section { padding: 100px 20px 60px; }
    }
  </style>
</head>

<body>
  <nav>
    <div class="brand-label">
      <img src="{% static 'core/logo.png' %}" alt="MyTherapyDoctor Logo">
      MyTherapyDoctor
    </div>
    <div class="brand-dot"></div>
  </nav>

  <section class="error-section">
    <div class="error-code">404</div>
    <h1>Page Not Found</h1>
    <p>
      The page you're looking for doesn't exist or may have been moved. Please check the address or return to the home page.
    </p>
    <div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center;">
      <button class="btn-ghost" onclick="goBack()">Go Back</button>
      <button class="btn-primary" onclick="goHome()">Home</button>
    </div>
  </section>

  <footer>
    &copy; 2025 MyTherapyDoctor &bull; <a href="mailto:info@mytherapydoctor.com" style="color:var(--teal-light);">info@mytherapydoctor.com</a>
  </footer>

  <script>
    window.addEventListener("load", () => document.body.classList.add("page-loaded"));
    window.addEventListener("pageshow", () => {
      document.body.classList.remove("page-exit");
      document.body.classList.add("page-loaded");
    });
    function goBack() {
      if (document.body.classList.contains("page-exit")) return;
      document.body.classList.remove("page-loaded");
      document.body.classList.add("page-exit");
      setTimeout(() => window.history.back(), 450);
    }
    function goHome() {
      if (document.body.classList.contains("page-exit")) return;
      document.body.classList.remove("page-loaded");
      document.body.classList.add("page-exit");
      setTimeout(() => window.location.href = "{% url 'welcome' %}", 450);
    }
  </script>
</body>
</html>
