<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Child Therapy</title>

  {% load static %}

  <style>

    /* =========================
       CUSTOM FONT
       ========================= */

    @font-face {
      font-family: 'Playfair Display';
      src: url("{% static 'PlayfairDisplay-SemiBoldItalic.ttf' %}") format('truetype');
      font-weight: 600;
      font-style: italic;
      font-display: swap;
    }


    /* =========================
       FULL SCREEN / NO PAGE SCROLL
       ========================= */

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;

      width: 100%;
      height: 100vh;
      height: 100dvh;

      margin: 0;
      padding: 0;

      /* Background image */
      background-image: url("/static/core/child.jpg.jpeg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      position: fixed;
      top: 0;
      left: 0;

      overflow: hidden;

      box-sizing: border-box;

      /* =========================
         PAGE TRANSITION
         ========================= */

      opacity: 0;
      transition: opacity 0.45s ease;
    }


    /* =========================
       PAGE FADE-IN
       ========================= */

    body.page-loaded {
      opacity: 1;
    }


    /* =========================
       PAGE FADE-OUT
       ========================= */

    body.page-exit {
      opacity: 0;
    }


    /* =========================
       BACK BUTTON
       ========================= */

    .back-button {
      position: fixed;

      top: 20px;
      left: 20px;

      padding: 10px 18px;

      border: none;
      border-radius: 6px;

      background: #6c757d;
      color: rgb(255, 255, 255);

      cursor: pointer;

      z-index: 1000;
    }

    .back-button:hover {
      background: #5a6268;
    }


    /* =========================
       FULL SCREEN CONTENT
       ========================= */

    .content {
      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100vh;
      height: 100dvh;

      margin: 0;
      padding: 80px 40px 30px;

      box-sizing: border-box;

      background-image: url("/static/core/child.jpg.jpeg");

      text-align: center;

      display: flex;
      flex-direction: column;

      overflow: hidden;
    }


    /* =========================
       TITLE
       ========================= */

    h1 {
      flex-shrink: 0;

      margin: 20px 0;

      font-size: 42px;

      color: white;

      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 600;
      font-style: italic;

      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.8);
    }


    /* =========================
       DESCRIPTION
       ========================= */

    p {
      flex-shrink: 0;

      line-height: 1.6;

      max-width: 900px;

      margin: 0 auto;

      font-size: 18px;

      color: white;

      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.8);
    }


    /* =========================
       CHAT BOX
       OUTER BOX DOES NOT SCROLL
       ========================= */

    .chat-box {
      width: 100%;
      max-width: 1100px;

      margin: 35px auto 0;

      flex: 1;

      min-height: 0;

      box-sizing: border-box;

      text-align: left;

      border: 1px solid #ccc;

      border-radius: 8px;

      padding: 20px;

      background: #fafafa;

      overflow: hidden;

      display: flex;
      flex-direction: column;
    }


    /* =========================
       CHAT MESSAGES
       ONLY THIS AREA SCROLLS
       ========================= */

    .chat-messages {
      flex: 1;

      min-height: 0;

      overflow-y: auto;
      overflow-x: hidden;

      padding-right: 8px;

      scroll-behavior: smooth;
    }


    /* =========================
       CHAT INPUT
       ALWAYS VISIBLE
       ========================= */

    .chat-input {
      width: 100%;
      max-width: 1100px;

      margin: 10px auto 0;

      display: flex;

      gap: 10px;

      flex-shrink: 0;

      box-sizing: border-box;
    }


    .chat-input input {
      flex: 1;

      min-width: 0;

      padding: 12px;

      border: 1px solid #ccc;

      border-radius: 5px;

      box-sizing: border-box;

      outline: none;
    }

    .chat-input input:focus {
      border-color: #007BFF;
    }


    .chat-input button {
      padding: 10px 20px;

      border: none;

      border-radius: 5px;

      background: #007BFF;

      color: white;

      cursor: pointer;

      flex-shrink: 0;
    }

    .chat-input button:hover {
      background: #0056b3;
    }


    /* =========================
       MESSAGES
       ========================= */

    .message {
      margin: 8px 0;

      line-height: 1.5;

      word-wrap: break-word;

      overflow-wrap: anywhere;
    }

    .user {
      color: #007BFF;
      font-weight: bold;
    }

    .ai {
      color: #28a745;
      font-weight: bold;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 768px) {

      .content {
        padding: 70px 15px 20px;
      }

      .back-button {
        top: 15px;
        left: 15px;

        padding: 8px 14px;

        font-size: 14px;
      }

      h1 {
        font-size: 30px;

        margin: 15px 0;
      }

      p {
        font-size: 16px;

        line-height: 1.5;
      }

      .chat-box {
        margin-top: 20px;

        padding: 15px;

        border-radius: 8px;
      }

      .chat-input {
        gap: 6px;
      }

      .chat-input input {
        padding: 10px;

        font-size: 14px;
      }

      .chat-input button {
        padding: 10px 15px;

        font-size: 14px;
      }

      .message {
        font-size: 14px;
      }
    }


    /* =========================
       VERY SMALL PHONES
       ========================= */

    @media (max-width: 400px) {

      .content {
        padding-left: 10px;
        padding-right: 10px;
      }

      h1 {
        font-size: 26px;
      }

      p {
        font-size: 14px;
      }

      .chat-box {
        padding: 10px;
      }

      .chat-input button {
        padding: 10px 12px;
      }
    }

  </style>
</head>

<body>

  <!-- Back button fixed top-left -->
  <button class="back-button" onclick="goBack()">Back to Sections</button>


  <div class="content">

    <h1>Child Therapy</h1>

    <p>
      This section focuses on therapy for children, helping them cope with 
      emotional, behavioral, and developmental challenges.
    </p>


    <!-- Chat Section -->
    <div class="chat-box" id="chat-box">

      <!-- ONLY THIS AREA SCROLLS -->
      <div class="chat-messages" id="chat-messages">

        <div class="message">
          <span class="ai">DANIEL CATER:</span>
          Hello! How can I support you today?
        </div>

      </div>

    </div>


    <!-- Chat Input -->
    <div class="chat-input">

      <input
        type="text"
        id="user-input"
        placeholder="Type your message..."
      >

      <button onclick="sendMessage()">Send</button>

    </div>

  </div>


 <script>
  /* =========================
     PAGE FADE-IN
     ========================= */
  window.addEventListener("DOMContentLoaded", function() {
    requestAnimationFrame(function() {
      document.body.classList.add("page-loaded");
    });
  });

  /* =========================
     BACK TO SECTIONS
     ========================= */
  function goBack() {
    if (document.body.classList.contains("page-exit")) {
      return;
    }
    document.body.classList.remove("page-loaded");
    document.body.classList.add("page-exit");
    setTimeout(function() {
      window.location.href = "{% url 'sections' %}";
    }, 450);
  }

  /* =========================
     CHAT FUNCTION
     ========================= */
  function sendMessage() {
    const input = document.getElementById("user-input");
    const chatBox = document.getElementById("chat-messages");
    const message = input.value.trim();

    if (message !== "") {

      // USER MESSAGE
      const userMsg = document.createElement("div");
      userMsg.classList.add("message");
      userMsg.innerHTML = "<span class='user'>You:</span> " + message;
      chatBox.appendChild(userMsg);

      // Scroll to the latest message
      chatBox.scrollTop = chatBox.scrollHeight;

      // Send to Django view
      fetch("", {
        method: "POST",
        headers: {
          "X-CSRFToken": "{{ csrf_token }}",
        },
        body: new URLSearchParams({ message: message })
      })
      .then(response => {
        if (!response.ok) {
          throw new Error("Server returned an error: " + response.status);
        }

        return response.json();
      })
      .then(data => {

        // Check that Django actually returned a reply
        if (!data.reply) {
          throw new Error("No AI reply was returned by the server.");
        }

        const aiMsg = document.createElement("div");
        aiMsg.classList.add("message");
        aiMsg.innerHTML = "<span class='ai'>DANIEL CATER:</span> " + data.reply;
        chatBox.appendChild(aiMsg);

        // Scroll to the latest message
        chatBox.scrollTop = chatBox.scrollHeight;
      })
      .catch(error => {
        console.error("AI Chat Error:", error);

        const errorMsg = document.createElement("div");
        errorMsg.classList.add("message");
        errorMsg.innerHTML = "<span class='ai'>AI:</span> Sorry, I couldn't process your message right now.";
        chatBox.appendChild(errorMsg);

        chatBox.scrollTop = chatBox.scrollHeight;
      });

      // Clear input
      input.value = "";
    }
  }
</script>


</body>
</html>
