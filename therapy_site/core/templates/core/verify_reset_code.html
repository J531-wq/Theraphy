<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Recovery Code — MyTherapyDoctor</title>
  <meta name="robots" content="noindex, nofollow">
  {% load static %}
  <link rel="icon" type="image/png" href="{% static 'core/logo.png' %}">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal:        #2e7d6e;
      --teal-light:  #3d9e8c;
      --teal-glow:   rgba(46,125,110,0.35);
      --glass-bg:    rgba(10,18,16,0.72);
      --glass-border:rgba(255,255,255,0.08);
      --input-bg:    rgba(255,255,255,0.05);
      --input-border:rgba(255,255,255,0.12);
      --text:        #f0f4f3;
      --muted:       rgba(240,244,243,0.5);
    }

    html, body {
      width: 100%; height: 100%;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.35) 100%),
        url("{% static 'core/Login.jpg.jpeg' %}") no-repeat center center / cover fixed;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    body.page-loaded { opacity: 1; }
    body.page-exit   { opacity: 0; }

    /* ── Card ── */
    .card {
      width: min(420px, 92vw);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      padding: 44px 40px 36px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.55), 0 0 0 1px var(--glass-border);
      animation: slideUp 0.55s cubic-bezier(0.22,1,0.36,1) both;
      text-align: left;
    }
    @keyframes slideUp {
      from { opacity:0; transform: translateY(28px); }
      to   { opacity:1; transform: translateY(0); }
    }

    /* ── Brand ── */
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .brand-logo { width: 36px; height: 36px; object-fit: contain; }
    .brand-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 10px var(--teal-glow);
    }
    .brand-name {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--teal-light);
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 18px;
    }

    /* ── Email chip ── */
    .email-chip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(46,125,110,0.14);
      border: 1px solid rgba(61,158,140,0.35);
      border-radius: 10px;
      padding: 11px 14px;
      margin-bottom: 26px;
      font-size: 13px;
      font-weight: 500;
      color: var(--teal-light);
      word-break: break-word;
      text-align: center;
    }
    .email-chip svg { flex-shrink: 0; }

    /* ── Fields ── */
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 7px;
    }
    .field input {
      width: 100%;
      padding: 13px 16px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      color: var(--text);
      font-size: 20px;
      font-family: inherit;
      letter-spacing: 8px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .field input::placeholder { color: rgba(240,244,243,0.35); letter-spacing: 2px; font-size: 15px; }
    .field input:focus {
      border-color: var(--teal-light);
      background: rgba(255,255,255,0.08);
    }

    /* ── Button ── */
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--teal), var(--teal-light));
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      letter-spacing: 0.3px;
      cursor: pointer;
      box-shadow: 0 4px 16px var(--teal-glow);
      transition: opacity 0.2s, transform 0.15s;
    }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }

    /* ── Error ── */
    .error-box {
      background: rgba(220,53,69,0.12);
      border: 1px solid rgba(220,53,69,0.35);
      border-radius: 8px;
      padding: 10px 14px;
      margin-top: 14px;
      font-size: 13px;
      color: #f88;
    }

    /* ── Back button ── */
    .back-btn {
      position: fixed;
      top: 20px; left: 20px;
      display: flex; align-items: center; gap: 6px;
      padding: 9px 16px;
      background: rgba(0,0,0,0.45);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: background 0.2s;
      z-index: 100;
    }
    .back-btn:hover { background: rgba(255,255,255,0.1); }
    .back-btn svg { flex-shrink: 0; }

    /* ── Mobile ── */
    @media (max-width: 480px) {
      body { align-items: flex-start; }
      .card { padding: 34px 24px 28px; margin-top: max(90px, 14vh); }
      h1 { font-size: 22px; }
      .back-btn { top: max(12px, env(safe-area-inset-top)); left: 12px; }
    }
    html, body { height: auto; min-height: 100%; }
    body {
      position: relative; min-height: 100dvh; overflow-x: hidden; overflow-y: auto;
      padding: 76px 16px 40px;
      background:
        radial-gradient(ellipse at 12% 18%, rgba(255,91,126,.72), transparent 32%),
        radial-gradient(ellipse at 88% 78%, rgba(113,90,255,.76), transparent 34%),
        radial-gradient(ellipse at 76% 10%, rgba(255,205,72,.62), transparent 26%),
        linear-gradient(135deg, #17132c 0%, #171a36 52%, #092e32 100%);
    }
    body::before, body::after {
      content: ""; position: fixed; z-index: 0; pointer-events: none; border-radius: 50%;
      animation: authDrift 9s ease-in-out infinite alternate;
    }
    body::before {
      width: 250px; height: 250px; top: 8%; left: -100px;
      border: 1px solid rgba(255,255,255,.35);
      box-shadow: 0 0 0 18px rgba(255,255,255,.035), 0 0 0 42px rgba(255,255,255,.025);
    }
    body::after {
      width: 160px; height: 160px; right: -52px; bottom: 8%;
      background: linear-gradient(145deg,#ffdb61,#ff777e); opacity: .8; animation-delay: -3s;
    }
    @keyframes authDrift {
      from { transform: translate3d(0,-8px,0) rotate(-8deg); }
      to { transform: translate3d(12px,16px,0) rotate(8deg); }
    }
    .card {
      position: relative; z-index: 1; overflow: visible;
      border: 1px solid rgba(255,255,255,.2); border-radius: 28px 10px 28px 10px;
      background: rgba(14,17,33,.91);
      box-shadow: 14px 18px 0 rgba(255,221,88,.9), 0 35px 100px rgba(0,0,0,.4);
    }
    .card::before {
      content: "✦"; position: absolute; top: -25px; right: 24px; display: grid;
      width: 54px; height: 54px; place-items: center;
      border: 2px solid #17132c; border-radius: 16px 50% 50%;
      color: #17132c; background: #ffdb61; font-size: 25px; transform: rotate(12deg);
      box-shadow: 4px 5px 0 #ff7189;
    }
    .brand-name { color: #9af4d1; }
    .brand-dot { background: #ffdb61; box-shadow: 0 0 12px rgba(255,219,97,.6); }
    h1 { font-size: clamp(26px,7vw,34px); letter-spacing: -.05em; }
    .subtitle { color: rgba(240,244,243,.72); }
    .email-chip { border-color: rgba(154,244,209,.35); color: #9af4d1; background: rgba(154,244,209,.09); }
    .field label { color: #b7c5ff; }
    .field input { border-radius: 12px; background: rgba(255,255,255,.08); }
    .field input:focus { border-color: #ffdb61; }
    .btn-primary {
      border-radius: 12px 4px 12px 4px; color: #17132c;
      background: linear-gradient(110deg,#ffdc65,#ff937c 52%,#ff70a0);
      box-shadow: 0 6px 24px rgba(255,112,160,.25); font-weight: 800;
    }
    .back-btn { border-radius: 999px; background: rgba(14,17,33,.6); }
    .error-box { color: #ffe2e7; background: rgba(255,87,117,.14); border-color: rgba(255,135,156,.45); }
    @media (max-width: 480px) {
      body { align-items: center; }
      .card { margin: 20px auto; }
    }
    @media (prefers-reduced-motion: reduce) {
      body, .card, body::before, body::after { animation: none; transition: none; }
    }
  </style>
</head>
<body>

  <button class="back-btn" onclick="goBack()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Back
  </button>

  <div class="card verify-box">
    <div class="brand">
      <img src="{% static 'core/logo.png' %}" alt="MyTherapyDoctor" class="brand-logo">
      <div class="brand-dot"></div>
      <span class="brand-name">MyTherapyDoctor</span>
    </div>

    <h1>Verify recovery code</h1>
    <p class="subtitle">A 6-digit recovery code has been sent to your registered email address.</p>

    <div class="email-chip">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="22,6 12,13 2,6"/></svg>
      {{ email }}
    </div>

    <form method="POST" id="verify-reset-form">
      {% csrf_token %}
      <div class="field">
        <label for="id_verification_code">Recovery Code</label>
        {{ form.verification_code }}
      </div>
      <button type="submit" class="btn-primary">Confirm Code</button>
    </form>

    {% if error %}
      <div class="error-box">{{ error }}</div>
    {% endif %}
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      requestAnimationFrame(() => document.body.classList.add("page-loaded"));
    });
    window.addEventListener("pageshow", () => {
      document.body.classList.remove("page-exit");
      document.body.classList.add("page-loaded");
    });
    function goBack() {
      document.body.classList.remove("page-loaded");
      document.body.classList.add("page-exit");
      setTimeout(() => window.location.href = "{% url 'login' %}", 380);
    }
    document.getElementById("verify-reset-form").addEventListener("submit", function() {
      document.body.classList.remove("page-loaded");
      document.body.classList.add("page-exit");
    });
  </script>

</body>
</html>
