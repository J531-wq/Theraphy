<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email - Therapy Site</title>
  <meta name="robots" content="noindex, nofollow">

    {% load static %}
  <link rel="icon" type="image/png" href="{% static 'core/logo.png' %}">


  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;

      background:
        linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.25)),
        url("{% static 'core/Register.jpg.jpeg' %}") no-repeat center center fixed;

      background-size: cover;

      text-align: center;
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100vh;
      height: 100dvh;

      overflow: hidden;

      display: flex;
      justify-content: center;
      align-items: center;

      /* Smooth page transition */
      opacity: 0;
      transition: opacity 0.45s ease;
    }


    /* =========================
       PAGE FADE IN
       ========================= */

    body.page-loaded {
      opacity: 1;
    }


    /* =========================
       PAGE FADE OUT
       ========================= */

    body.page-exit {
      opacity: 0;
    }


    /* =========================
       VERIFICATION BOX
       ========================= */

    .verify-box {
      color: white;

      background: black;

      width: 350px;

      margin: 100px auto;

      padding: 25px 20px;

      border-radius: 8px;

      box-shadow: 0 2px 5px rgba(0,0,0,0.1);

      box-sizing: border-box;
    }


    .verify-box h2 {
      margin-top: 0;
      margin-bottom: 15px;
    }


    .notification {
      font-size: 15px;

      line-height: 1.5;

      margin-bottom: 10px;
    }


    .email {
      color: #28a745;

      font-weight: bold;

      word-break: break-word;

      margin-bottom: 20px;
    }


    input {
      width: 90%;

      padding: 10px;

      margin: 10px 0;

      border: 1px solid #ccc;

      border-radius: 5px;

      box-sizing: border-box;

      text-align: center;

      font-size: 16px;

      letter-spacing: 2px;
    }


    button {
      padding: 10px 20px;

      border: none;

      border-radius: 5px;

      background: #28a745;

      color: white;

      cursor: pointer;
    }


    button:hover {
      background: #1e7e34;
    }


    .error {
      color: red;

      margin-top: 10px;

      font-weight: bold;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      .verify-box {
        width: 90%;

        padding: 22px 15px;
      }

      .verify-box h2 {
        font-size: 24px;
      }

      .notification {
        font-size: 14px;
      }

      .email {
        font-size: 14px;
      }
    }
    body {
      position: relative;
      min-height: 100dvh;
      height: auto;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 72px 16px;
      color: #f0f4f3;
      text-align: left;
      background:
        radial-gradient(ellipse at 12% 18%, rgba(255,91,126,.72), transparent 32%),
        radial-gradient(ellipse at 88% 78%, rgba(113,90,255,.76), transparent 34%),
        radial-gradient(ellipse at 76% 10%, rgba(255,205,72,.62), transparent 26%),
        linear-gradient(135deg, #17132c 0%, #171a36 52%, #092e32 100%);
    }
    body::before, body::after {
      content: "";
      position: fixed;
      z-index: 0;
      pointer-events: none;
      border-radius: 50%;
      animation: authDrift 9s ease-in-out infinite alternate;
    }
    body::before {
      width: 250px; height: 250px; top: 8%; left: -100px;
      border: 1px solid rgba(255,255,255,.35);
      box-shadow: 0 0 0 18px rgba(255,255,255,.035), 0 0 0 42px rgba(255,255,255,.025);
    }
    body::after {
      width: 160px; height: 160px; right: -52px; bottom: 8%;
      background: linear-gradient(145deg,#ffdb61,#ff777e); opacity: .8; animation-delay: -3s;
    }
    @keyframes authDrift {
      from { transform: translate3d(0,-8px,0) rotate(-8deg); }
      to { transform: translate3d(12px,16px,0) rotate(8deg); }
    }
    .verify-box {
      position: relative;
      z-index: 1;
      width: min(460px, 100%);
      margin: auto;
      padding: 38px 34px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 28px 10px 28px 10px;
      color: #f0f4f3;
      background: rgba(14,17,33,.93);
      box-shadow: 14px 18px 0 rgba(255,221,88,.9), 0 35px 100px rgba(0,0,0,.4);
      backdrop-filter: blur(18px);
    }
    .verify-box::before {
      content: "✦";
      position: absolute;
      top: -25px;
      right: 24px;
      display: grid;
      width: 54px;
      height: 54px;
      place-items: center;
      border: 2px solid #17132c;
      border-radius: 16px 50% 50%;
      color: #17132c;
      background: #ffdb61;
      font-size: 25px;
      transform: rotate(12deg);
      box-shadow: 4px 5px 0 #ff7189;
    }
    .verify-box h2 { font-size: clamp(26px,7vw,34px); letter-spacing: -.05em; }
    .notification { color: rgba(240,244,243,.72); }
    .email { color: #9af4d1; }
    .verify-box input {
      width: 100%;
      margin: 10px 0 16px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 12px;
      color: #f0f4f3;
      background: rgba(255,255,255,.08);
    }
    .verify-box input:focus { outline: 2px solid #ffdb61; }
    .verify-box button {
      width: 100%;
      padding: 14px;
      border-radius: 12px 4px 12px 4px;
      color: #17132c;
      background: linear-gradient(110deg,#ffdc65,#ff937c 52%,#ff70a0);
      font-weight: 800;
    }
    .verify-box button:hover { background: linear-gradient(110deg,#ffe887,#ffad93 52%,#ff8ab2); }
    .error { color: #ff9aab; }
    @media (max-width: 600px) { .verify-box { padding: 34px 24px; } }
    @media (prefers-reduced-motion: reduce) {
      body, body::before, body::after { animation: none; transition: none; }
    }

  </style>
  <link rel="stylesheet" href="{% static 'core/responsive.css' %}">
</head>

<body>

  <div class="verify-box">

    <h2>Verify Your Email</h2>

    <p class="notification">
      A verification code has been sent to your registered email address.
    </p>

    <p class="email">
      {{ email }}
    </p>


    <form method="POST" id="verify-form">

      {% csrf_token %}

      {{ form.verification_code }}

      <br>

      <button type="submit">Confirm</button>

    </form>


    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

  </div>


  <!-- =========================
       SMOOTH PAGE TRANSITION
       ========================= -->

  <script>

    /* Fade in when verification page loads */
    window.addEventListener("load", function() {
      document.body.classList.add("page-loaded");
    });


    /* Fade out when verification form is submitted */
    document.getElementById("verify-form").addEventListener("submit", function() {

      document.body.classList.remove("page-loaded");
      document.body.classList.add("page-exit");

    });

  </script>

</body>
</html>
