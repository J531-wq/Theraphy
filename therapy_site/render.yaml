databases:
  - name: therapy-db
    plan: free

services:
  - type: web
    name: therapy-site
    runtime: python
    buildCommand: bash build.sh
    startCommand: gunicorn therapy_site.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: therapy-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "True"
      - key: SECURE_HSTS_PRELOAD
        value: "True"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: GROQ_API_KEY
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false