# /etc/nginx/conf.d/therapy_site.conf   (RHEL-family: CentOS/Rocky/Alma/Alibaba Cloud Linux)
# /etc/nginx/sites-available/therapy_site (Debian/Ubuntu: then symlink into sites-enabled)
#
# On RHEL-family systems nginx does not use sites-available/sites-enabled —
# just drop this file at /etc/nginx/conf.d/therapy_site.conf and reload nginx.
#
# NOTE: replace "yourdomain.com" with your real domain (or VPS IP if no domain).
# After installing certbot, it will rewrite this file to add the HTTPS block.

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Max upload size for request bodies
    client_max_body_size 10M;

    # Static files served directly by nginx (from Django's collectstatic)
    location /static/ {
        alias /home/deploy/therapy_site/therapy_site/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Optional: serve robots/favicon from static
    location = /favicon.ico {
        alias /home/deploy/therapy_site/therapy_site/staticfiles/core/favicon.ico;
        access_log off;
        log_not_found off;
    }

    # Everything else goes to Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;   # AI replies can take a few seconds
    }

    # Django's SECURE_SSL_REDIRECT will redirect HTTP->HTTPS itself,
    # but terminate TLS here after running certbot --nginx.
}
