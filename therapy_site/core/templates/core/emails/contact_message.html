<!doctype html>
<html><body style="margin:0;background:#f3f7f5;color:#183128;font-family:Arial,sans-serif;">
  <div style="max-width:620px;margin:0 auto;padding:30px;background:#fff;">
    <p style="margin:0 0 18px;color:#2e7d6e;font-size:12px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;">New contact form message</p>
    <h1 style="margin:0 0 22px;font-size:24px;color:#173b2f;">{{ subject }}</h1>
    <table style="width:100%;border-collapse:collapse;margin-bottom:22px;font-size:14px;">
      <tr><td style="padding:10px;border-bottom:1px solid #e1ebe6;color:#668176;width:110px;">From</td><td style="padding:10px;border-bottom:1px solid #e1ebe6;color:#173b2f;font-weight:bold;">{{ name }}</td></tr>
      <tr><td style="padding:10px;border-bottom:1px solid #e1ebe6;color:#668176;">Email</td><td style="padding:10px;border-bottom:1px solid #e1ebe6;"><a style="color:#2e7d6e" href="mailto:{{ email }}">{{ email }}</a></td></tr>
    </table>
    <div style="padding:18px;background:#f1f7f4;border-left:3px solid #3d9e8c;white-space:pre-wrap;font-size:15px;line-height:1.65;">{{ message }}</div>
  </div>
</body></html>
