<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forbidden - Therapy Portal</title>
  {% load static %}

  <style>
    /* Playfair Display - custom font for the heading only */
    @font-face {
      font-family: 'Playfair Display';
      src: url("{% static 'PlayfairDisplay-SemiBoldItalic.ttf' %}") format('truetype');
      font-weight: 600;
      font-style: italic;
      font-display: swap;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      min-width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;

      background:
        linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)),
        url("{% static 'core/Login.jpg.jpeg' %}") no-repeat center center fixed;

      background-size: cover;

      color: white;

      /* Smooth page transition */
      opacity: 0;
      transition: opacity 0.45s ease;
    }

    /* Fade in when it loads */
    body.page-loaded {
      opacity: 1;
    }

    /* Fade out before navigating */
    body.page-exit {
      opacity: 0;
    }

    .error-box {
      text-align: center;
      padding: 40px 30px;
      max-width: 600px;
      width: 90%;
      background: rgba(0, 0, 0, 0.55);
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
    }

    .error-code {
      font-size: 96px;
      font-weight: 600;
      font-style: italic;
      font-family: 'Playfair Display', Georgia, serif;
      margin: 0 0 15px 0;
      color: #d81515;
      text-shadow: 2px 2px 7px rgba(0, 0, 0, 0.8);
      line-height: 1;
    }

    h1 {
      margin: 0 0 12px 0;
      font-size: 30px;
      font-weight: 600;
      font-style: italic;
      font-family: 'Playfair Display', Georgia, serif;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.8);
    }

    p {
      margin: 0 0 30px 0;
      font-size: 17px;
      line-height: 1.6;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
    }

    .actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    button {
      width: 140px;
      padding: 13px 20px;
      border: none;
      border-radius: 6px;
      background: #007BFF;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: 0.2s ease;
    }

    button:hover {
      background: #0056b3;
      transform: translateY(-2px);
    }

    button.secondary {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    button.secondary:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    @media (max-width: 600px) {
      .error-code {
        font-size: 72px;
      }

      h1 {
        font-size: 24px;
      }

      p {
        font-size: 15px;
      }

      .error-box {
        padding: 30px 20px;
      }

      button {
        width: 120px;
        padding: 11px 15px;
      }
    }
  </style>
  <link rel="stylesheet" href="{% static 'core/responsive.css' %}">
</head>

<body>

  <div class="error-box">
    <div class="error-code">403</div>
    <h1>Forbidden</h1>
    <p>
      You don't have permission to access this page.
      If you believe this is a mistake, please return to the home page.
    </p>

    <div class="actions">
      <button onclick="goBack()">Go Back</button>
      <button class="secondary" onclick="goHome()">Home</button>
    </div>
  </div>

  <script>
    /* Fade in when the error page loads */
    window.addEventListener("load", function() {
      document.body.classList.add("page-loaded");
    });

    function goBack() {
      if (document.body.classList.contains("page-exit")) return;
      document.body.classList.remove("page-loaded");
      document.body.classList.add("page-exit");
      setTimeout(function() {
        window.history.back();
      }, 450);
    }

    function goHome() {
      if (document.body.classList.contains("page-exit")) return;
      document.body.classList.remove("page-loaded");
      document.body.classList.add("page-exit");
      setTimeout(function() {
        window.location.href = "{% url 'welcome' %}";
      }, 450);
    }
  </script>

</body>
</html>
