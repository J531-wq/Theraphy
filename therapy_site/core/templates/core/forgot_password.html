<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password / Username - Therapy Site</title>

  {% load static %}

  <style>
    body {
      font-family: Arial, sans-serif;

      background:
        linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.25)),
        url("{% static 'core/Login.jpg.jpeg' %}") no-repeat center center fixed;

      background-size: cover;

      text-align: center;
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100vh;
      height: 100dvh;

      overflow: hidden;

      display: flex;
      justify-content: center;
      align-items: center;

      /* Smooth page transition */
      opacity: 0;
      transition: opacity 0.45s ease;
    }


    /* =========================
       PAGE FADE IN
       ========================= */

    body.page-loaded {
      opacity: 1;
    }


    /* =========================
       PAGE FADE OUT
       ========================= */

    body.page-exit {
      opacity: 0;
    }


    /* =========================
       FORGOT PASSWORD BOX
       ========================= */

    .forgot-box {
      color: white;

      background: black;

      width: 350px;

      margin: 100px auto;

      padding: 25px 20px;

      border-radius: 8px;

      box-shadow: 0 2px 5px rgba(0,0,0,0.1);

      box-sizing: border-box;
    }


    .forgot-box h2 {
      margin-top: 0;
      margin-bottom: 15px;
    }


    .notification {
      font-size: 15px;

      line-height: 1.5;

      margin-bottom: 20px;
    }


    input {
      width: 90%;

      padding: 10px;

      margin: 10px 0;

      border: 1px solid #ccc;

      border-radius: 5px;

      box-sizing: border-box;
    }


    input::placeholder {
      color: #888;

      opacity: 1;
    }


    button {
      padding: 10px 20px;

      border: none;

      border-radius: 5px;

      background: #007BFF;

      color: white;

      cursor: pointer;
    }


    button:hover {
      background: #0056b3;
    }


    .error {
      color: red;

      margin-top: 10px;

      font-weight: bold;
    }


    /* =========================
       BACK TO LOGIN
       ========================= */

    .back-button {
      position: fixed;

      top: 20px;
      left: 20px;

      padding: 10px 18px;

      border: none;

      border-radius: 6px;

      background: #6c757d;

      color: white;

      cursor: pointer;

      z-index: 1000;
    }


    .back-button:hover {
      background: #5a6268;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      .forgot-box {
        width: 90%;

        padding: 22px 15px;
      }

      .forgot-box h2 {
        font-size: 24px;
      }

      .notification {
        font-size: 14px;
      }
    }

  </style>
</head>

<body>

  <!-- Back button -->
  <button class="back-button" onclick="goBack()">Back to Login</button>


  <div class="forgot-box">

    <h2>Forgot Password / Username</h2>

    <p class="notification">
      Enter your username below. A verification code will be
      automatically sent to the email address registered with
      your account.
    </p>


    <form method="POST" id="forgot-password-form">

      {% csrf_token %}

      {{ form.username }}

      <br>

      <button type="submit">Send Verification Code</button>

    </form>


    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

  </div>


  <!-- =========================
       SMOOTH PAGE TRANSITION
       ========================= -->

  <script>

    /* Fade in when Forgot Password page loads */
    window.addEventListener("load", function() {
      document.body.classList.add("page-loaded");
    });


    /* Fade out before going back to Login */
    function goBack() {

      document.body.classList.remove("page-loaded");
      document.body.classList.add("page-exit");

      setTimeout(function() {
        window.location.href = "{% url 'login' %}";
      }, 450);

    }


    /* Fade out when form is submitted */
    document.getElementById("forgot-password-form").addEventListener("submit", function() {

      document.body.classList.remove("page-loaded");
      document.body.classList.add("page-exit");

    });

  </script>

</body>
</html>
