<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — MyTherapyDoctor</title>
  <meta name="robots" content="noindex, nofollow">
    {% load static %}
  <link rel="icon" type="image/png" href="{% static 'core/logo.png' %}">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal:       #2e7d6e;
      --teal-light: #3d9e8c;
      --teal-glow:  rgba(46,125,110,0.35);
      --glass-bg:   rgba(10,18,16,0.72);
      --glass-border: rgba(255,255,255,0.08);
      --input-bg:   rgba(255,255,255,0.05);
      --input-border: rgba(255,255,255,0.12);
      --text:       #f0f4f3;
      --muted:      rgba(240,244,243,0.5);
    }

    html, body {
      width: 100%; height: 100%;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.35) 100%),
        url("{% static 'core/Login.jpg.jpeg' %}") no-repeat center center / cover fixed;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    body.page-loaded { opacity: 1; }
    body.page-exit   { opacity: 0; }

    /* ── Card ── */
    .card {
      width: min(420px, 94vw);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      padding: 44px 40px 36px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.55), 0 0 0 1px var(--glass-border);
      animation: slideUp 0.55s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes slideUp {
      from { opacity:0; transform: translateY(28px); }
      to   { opacity:1; transform: translateY(0); }
    }

                
    
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .brand-logo {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }
    .brand-name {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--teal-light);
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 32px;
    }

    /* ── Fields ── */
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 7px;
    }
    .field input {
      width: 100%;
      padding: 13px 16px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input::placeholder { color: rgba(255,255,255,0.25); }
    .field input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px var(--teal-glow);
    }

    /* ── Password toggle ── */
    .password-wrap {
      position: relative;
    }
    .password-wrap input {
      width: 100%;
      padding-right: 46px;
    }
    .eye-btn {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      color: #555;
      display: flex;
      align-items: center;
      line-height: 0;
      transition: color 0.2s;
    }
    .eye-btn:hover { color: #111; }

    /* ── Button ── */
    .btn-primary {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      background: linear-gradient(135deg, var(--teal) 0%, var(--teal-light) 100%);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: opacity 0.2s, transform 0.15s;
      box-shadow: 0 4px 20px var(--teal-glow);
    }
    .btn-primary:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }

    /* ── Links & extras ── */
    .forgot-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: var(--teal-light);
      text-decoration: none;
      transition: color 0.2s;
    }
    .forgot-link:hover { color: #fff; }

    .divider {
      border: none;
      border-top: 1px solid var(--glass-border);
      margin: 24px 0 18px;
    }
    .register-row {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }
    .register-row a {
      color: var(--teal-light);
      text-decoration: none;
      font-weight: 500;
    }
    .register-row a:hover { color: #fff; }

    /* ── Error ── */
    .error-box {
      background: rgba(220,53,69,0.12);
      border: 1px solid rgba(220,53,69,0.35);
      border-radius: 8px;
      padding: 10px 14px;
      margin-top: 14px;
      font-size: 13px;
      color: #f88;
    }

    /* ── Back button ── */
    .back-btn {
      position: fixed;
      top: 20px; left: 20px;
      display: flex; align-items: center; gap: 6px;
      padding: 9px 16px;
      background: rgba(0,0,0,0.45);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: background 0.2s;
      z-index: 100;
    }
    .back-btn:hover { background: rgba(255,255,255,0.1); }
    .back-btn svg { flex-shrink: 0; }

    body {
      position: relative;
      width: 100%;
      height: auto;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 72px 18px 48px;
      background:
        radial-gradient(ellipse at 12% 18%, rgba(255, 91, 126, .72), transparent 32%),
        radial-gradient(ellipse at 88% 78%, rgba(113, 90, 255, .76), transparent 34%),
        radial-gradient(ellipse at 76% 10%, rgba(255, 205, 72, .62), transparent 26%),
        linear-gradient(135deg, #17132c 0%, #171a36 52%, #092e32 100%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: 0;
      pointer-events: none;
      border-radius: 50%;
      animation: floatGlow 9s ease-in-out infinite alternate;
    }
    body::before {
      width: 290px;
      height: 290px;
      top: 8%;
      left: -100px;
      border: 1px solid rgba(255,255,255,.35);
      box-shadow: 0 0 0 18px rgba(255,255,255,.035), 0 0 0 42px rgba(255,255,255,.025);
    }
    body::after {
      width: 180px;
      height: 180px;
      right: -52px;
      bottom: 8%;
      background: linear-gradient(145deg, #ffdb61, #ff777e);
      opacity: .8;
      animation-delay: -3s;
    }
    @keyframes floatGlow {
      from { transform: translate3d(0, -8px, 0) rotate(-8deg); }
      to { transform: translate3d(12px, 16px, 0) rotate(8deg); }
    }

    .card {
      position: relative;
      z-index: 1;
      overflow: visible;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 28px 10px 28px 10px;
      background: rgba(14, 17, 33, .91);
      box-shadow: 18px 22px 0 rgba(255, 221, 88, .9), 0 35px 100px rgba(0,0,0,.4);
    }
    .card::before {
      content: "✦";
      position: absolute;
      top: -25px;
      right: 24px;
      display: grid;
      width: 54px;
      height: 54px;
      place-items: center;
      border: 2px solid #17132c;
      border-radius: 16px 50% 50%;
      color: #17132c;
      background: #ffdb61;
      font-size: 25px;
      transform: rotate(12deg);
      box-shadow: 4px 5px 0 #ff7189;
    }
    .brand-logo {
      padding: 5px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 12px;
      background: rgba(255,255,255,.1);
    }
    .brand-name { color: #9af4d1; }
    h1 { font-size: clamp(30px, 7vw, 40px); letter-spacing: -.06em; }
    .subtitle { color: rgba(240,244,243,.72); line-height: 1.6; }
    .field label { color: #b7c5ff; }
    .field input {
      border-radius: 12px;
      background: rgba(255,255,255,.08);
      border-color: rgba(255,255,255,.2);
    }
    .field input:focus {
      border-color: #ffdb61;
      box-shadow: 0 0 0 4px rgba(255,219,97,.2);
    }
    .eye-btn { color: rgba(240,244,243,.75); }
    .eye-btn:hover { color: #ffdb61; }
    .btn-primary {
      border-radius: 12px 4px 12px 4px;
      color: #17132c;
      background: linear-gradient(110deg, #ffdc65, #ff937c 52%, #ff70a0);
      box-shadow: 0 6px 24px rgba(255,112,160,.25);
      font-weight: 800;
    }
    .forgot-link, .register-row a { color: #9af4d1; }
    .back-btn {
      border-color: rgba(255,255,255,.24);
      border-radius: 999px;
      color: white;
      background: rgba(14,17,33,.6);
    }
    .error-box {
      color: #ffe2e7;
      background: rgba(255,87,117,.14);
      border-color: rgba(255,135,156,.45);
    }
    @media (max-width: 480px) {
      body { padding: 70px 18px 38px; }
      .card { margin: auto; }
    }
    @media (prefers-reduced-motion: reduce) {
      body, .card, body::before, body::after { animation: none; transition: none; }
    }
  </style>
</head>
<body>

  <button class="back-btn" onclick="goBack()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Back
  </button>

  <div class="card">
    <div class="brand">
      <img src="{% static 'core/logo.png' %}" alt="MyTherapyDoctor" class="brand-logo">
      <span class="brand-name">MyTherapyDoctor</span>
    </div>

    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to continue your wellness journey</p>

    <form method="POST" id="login-form">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next|default:'' }}">
      <div class="field">
        <label for="id_username">Username</label>
        <input type="text" name="username" id="id_username" placeholder="Your username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="id_password">Password</label>
        <div class="password-wrap">
          <input type="password" name="password" id="id_password" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="eye-btn" onclick="togglePw('id_password',this)" aria-label="Toggle password visibility">
            <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-primary">Sign In</button>
    </form>

    <a href="{% url 'forgot_password' %}" class="forgot-link">Forgot password or username?</a>

    {% if error %}
      <div class="error-box">{{ error }}</div>
    {% endif %}

    <hr class="divider">
    <p class="register-row">Don't have an account? <a href="{% url 'register' %}" onclick="navTo(event, this.href)">Create one</a></p>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      requestAnimationFrame(() => document.body.classList.add("page-loaded"));
    });
    window.addEventListener("pageshow", () => {
      document.body.classList.remove("page-exit");
      document.body.classList.add("page-loaded");
    });
    function goBack() {
      document.body.classList.remove("page-loaded");
      document.body.classList.add("page-exit");
      setTimeout(() => window.location.href = "{% url 'welcome' %}", 380);
    }
    function navTo(e, href) {
      e.preventDefault();
      document.body.classList.remove("page-loaded");
      document.body.classList.add("page-exit");
      setTimeout(() => window.location.href = href, 380);
    }
    function togglePw(id, btn) {
      const input = document.getElementById(id);
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      btn.querySelector('.eye-open').style.display  = isHidden ? 'none'  : '';
      btn.querySelector('.eye-closed').style.display = isHidden ? ''     : 'none';
    }
  </script>
</body>
</html>
