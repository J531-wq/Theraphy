{% load static %}
<header class="admin-topbar">
  <a class="admin-topbar-brand" href="{% url 'admin_dashboard' %}">
    <img src="{% static 'core/logo.png' %}" alt="">
    <span class="admin-topbar-title">MyTherapyDoctor<small>Admin control centre</small></span>
  </a>
  <button class="admin-menu-toggle" id="admin-menu-toggle" type="button" aria-label="Open admin navigation" aria-controls="admin-sidebar" aria-expanded="false"><span class="admin-menu-label">Menu</span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div class="admin-topbar-actions">
    <span class="admin-role">Administrator</span>
    <a class="admin-topbar-action" href="{% url 'blog_list' %}">View journal</a>
    <a class="admin-topbar-action signout" href="{% url 'logout' %}"><span aria-hidden="true">↗</span> Sign out</a>
  </div>
</header>

<aside class="admin-sidebar" id="admin-sidebar" aria-label="Admin dashboard navigation">
  <div class="admin-sidebar-label">Workspace</div>
  <a class="admin-sidebar-link" href="{% url 'admin_dashboard' %}" {% if active_admin_page == "overview" %}aria-current="page"{% endif %}><span class="admin-sidebar-icon">⌂</span>Overview</a>
  <a class="admin-sidebar-link" href="{% url 'admin_posts' %}" {% if active_admin_page == "posts" %}aria-current="page"{% endif %}><span class="admin-sidebar-icon">▤</span>Post management</a>
  <a class="admin-sidebar-link" href="{% url 'admin_create_post' %}" {% if active_admin_page == "create" %}aria-current="page"{% endif %}><span class="admin-sidebar-icon">✎</span>Create post</a>
  <a class="admin-sidebar-link" href="{% url 'admin_withdrawals' %}" {% if active_admin_page == "withdrawals" %}aria-current="page"{% endif %}><span class="admin-sidebar-icon">₦</span>Withdrawals</a>
  <div class="admin-sidebar-spacer"></div>
  <div class="admin-sidebar-label">Quick links</div>
  <a class="admin-sidebar-link" href="{% url 'welcome' %}"><span class="admin-sidebar-icon">↗</span>View website</a>
  <a class="admin-sidebar-link" href="/admin/"><span class="admin-sidebar-icon">⚙</span>Django admin</a>
</aside>
<div class="admin-sidebar-overlay" id="sidebar-overlay"></div>

<script>
  (() => {
    const toggle = document.getElementById('admin-menu-toggle');
    const sidebar = document.getElementById('admin-sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    if (!toggle || !sidebar || !overlay) return;
    const setOpen = open => {
      sidebar.classList.toggle('open', open);
      overlay.classList.toggle('open', open);
      toggle.setAttribute('aria-expanded', String(open));
      toggle.setAttribute('aria-label', open ? 'Close admin navigation' : 'Open admin navigation');
    };
    toggle.addEventListener('click', () => {
      setOpen(toggle.getAttribute('aria-expanded') !== 'true');
    });
    overlay.addEventListener('click', () => setOpen(false));
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') setOpen(false);
    });
  })();
</script>
