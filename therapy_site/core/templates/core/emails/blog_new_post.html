<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="font-family: Arial, sans-serif; background:#f4f7f6; padding:24px; margin:0;">
  <div style="max-width:600px; margin:0 auto; background:#ffffff; border-radius:12px; padding:32px; border-top:4px solid #2e7d6e;">
    <p style="font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:#3d9e8c; margin:0 0 8px;">{{ category }} · New post</p>
    <h2 style="color:#1d2b28; margin-top:0;">{{ post_title }}</h2>
    <p>Hi {{ name }},</p>
    <p>We just published a new article on the MyTherapyDoctor Blog:</p>
    <blockquote style="border-left:3px solid #2e7d6e; margin:16px 0; padding:8px 16px; color:#444;">{{ post_excerpt }}</blockquote>
    <p style="margin:28px 0;">
      <a href="{{ post_url }}" style="background:#2e7d6e; color:#ffffff; text-decoration:none; padding:12px 28px; border-radius:8px; font-weight:bold;">Read the full article</a>
    </p>
    <p style="font-size:12px; color:#888;">You're receiving this because you subscribed at mytherapydoctor.com. <a href="{{ unsubscribe_url }}">Unsubscribe</a>.</p>
  </div>
</body>
</html>
